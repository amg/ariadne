# Production deployment — zero published ports except dedicated DB port.
# The frontend joins the homelab's existing external `cloudflare-network`
# so the already-running cloudflared resolves it by container name.
# Backend stays internal — the only way in is the tunnel.
#
# Usage:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#   npm run migrate:prod

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Dedicated DB port for LAN tooling from the 50.x/57.x nets
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat-network-prod


  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    container_name: chat_supertokens_prod
    depends_on:
      - db
    # No published ports - backend accesses it internally
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      API_KEYS: ${SUPERTOKENS_API_KEY}
    networks:
      - chat-network-prod
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat_backend_prod
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - DEBUG=${DEBUG}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - TITLING_MODEL=${TITLING_MODEL}
      - MOCK_AI_BASE_URL=${MOCK_AI_BASE_URL}
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS}
      - EXCHANGE_STALENESS_MS=${EXCHANGE_STALENESS_MS}
      - AI_TITLING_TIMEOUT_MS=${AI_TITLING_TIMEOUT_MS}
      - ENABLE_REASONING=${ENABLE_REASONING}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - THREAD_ANALYSIS_MODE=${THREAD_ANALYSIS_MODE}
      - JUDGE_MODEL=${JUDGE_MODEL}
      - REWRITE_MODEL=${REWRITE_MODEL}
      - DAILY_SPEND_BUDGET_USD=${DAILY_SPEND_BUDGET_USD}
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
    # No published ports — backend is internal only
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - chat-network-prod

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_frontend_prod
    # No published ports — Cloudflare Tunnel resolves by container name
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network-prod
      - cloudflare-network

volumes:
  pgdata_prod:

networks:
  chat-network-prod:
    driver: bridge
  cloudflare-network:
    external: true
    name: cloudflare-network
