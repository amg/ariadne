# Production deployment — zero published ports except dedicated DB port.
# The frontend joins the homelab's existing external `cloudflare-network`
# so the already-running cloudflared resolves it by container name.
# Backend stays internal — the only way in is the tunnel.
#
# Usage:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#   npm run migrate:prod

# Own project name: dev, staging and prod share this directory, and a shared
# project would treat the other tiers' containers as orphans of this one.
name: alex-chat-bot-prod

# Docker never rotates container logs on its own; cap each service at ~30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # Dependents wait for this, so a host reboot never starts them against a
    # database that is still starting up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks:
      - chat-network-prod


  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    container_name: chat_supertokens_prod
    depends_on:
      db:
        condition: service_healthy
    # No published ports - backend accesses it internally
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      POSTGRESQL_TABLE_SCHEMA: auth
      API_KEYS: ${SUPERTOKENS_API_KEY}
    networks:
      - chat-network-prod
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat_backend_prod
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - DEBUG=${DEBUG}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - TITLING_MODEL=${TITLING_MODEL}
      - MOCK_AI_BASE_URL=${MOCK_AI_BASE_URL}
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS}
      - EXCHANGE_STALENESS_MS=${EXCHANGE_STALENESS_MS}
      - GATE_WAIT_MS=${GATE_WAIT_MS}
      - HANDOVER_WAIT_MS=${HANDOVER_WAIT_MS}
      - AI_TITLING_TIMEOUT_MS=${AI_TITLING_TIMEOUT_MS}
      - ENABLE_REASONING=${ENABLE_REASONING}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - THREAD_ANALYSIS_MODE=${THREAD_ANALYSIS_MODE}
      - JUDGE_MODEL=${JUDGE_MODEL}
      - REWRITE_MODEL=${REWRITE_MODEL}
      - MEMORY_MODEL=${MEMORY_MODEL}
      - FEATURE_MEMORY=${FEATURE_MEMORY:-false}
      - DAILY_SPEND_BUDGET_USD=${DAILY_SPEND_BUDGET_USD}
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
      - AUTH_SIGNUP_ENABLED=${AUTH_SIGNUP_ENABLED:-true}
    # No published ports — backend is internal only
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_started
    restart: unless-stopped
    logging: *logging
    networks:
      - chat-network-prod

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_frontend_prod
    # No published ports — Cloudflare Tunnel resolves by container name
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging
    networks:
      - chat-network-prod
      - cloudflare-network

volumes:
  pgdata_prod:

networks:
  chat-network-prod:
    driver: bridge
  cloudflare-network:
    external: true
    name: cloudflare-network
