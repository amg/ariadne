# Staging deployment — the full Docker build, for exercising the exact
# container images (backend, frontend) before they go to prod.
# Shares `.env` with the dev tier, so it publishes the same ports
# (`${DB_PORT}`, SuperTokens 3567, backend 3001, frontend 5173): bring
# the dev infrastructure down before lifting this. DB stays on loopback,
# and container/volume/network names are distinct from dev and prod so a
# leftover staging stack can never collide with either. Like prod, it
# always answers with DeepInfra: dev's mock runs outside the containers.
#
# Usage:
#   docker compose -f compose.dev.yml --env-file .env down  # free the ports
#   docker compose -f compose.staging.yml --env-file .env up -d
#   npm run migrate

# Own project name: dev, staging and prod share this directory, and a shared
# project would let one tier's `up` replace another tier's containers.
name: alex-chat-bot-staging

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db_staging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-chatbot_dev}
    # Loopback only — not accessible from other containers
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat-network-staging

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat_backend_staging
    environment:
      - PORT=${PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-devpassword}@db:5432/${DB_NAME:-chatbot_dev}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Qwen/Qwen3.5-9B}
      - TITLING_MODEL=${TITLING_MODEL}
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS:-5000}
      - EXCHANGE_STALENESS_MS=${EXCHANGE_STALENESS_MS:-300000}
      - GATE_WAIT_MS=${GATE_WAIT_MS:-10000}
      - HANDOVER_WAIT_MS=${HANDOVER_WAIT_MS:-10000}
      - AI_TITLING_TIMEOUT_MS=${AI_TITLING_TIMEOUT_MS:-5000}
      - ENABLE_REASONING=${ENABLE_REASONING:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - THREAD_ANALYSIS_MODE=${THREAD_ANALYSIS_MODE:-heuristic}
      - JUDGE_MODEL=${JUDGE_MODEL:-Qwen/Qwen3.5-9B}
      - REWRITE_MODEL=${REWRITE_MODEL:-Qwen/Qwen3.5-9B}
      - MEMORY_MODEL=${MEMORY_MODEL:-Qwen/Qwen3.5-9B}
      - FEATURE_MEMORY=${FEATURE_MEMORY:-false}
      - DAILY_SPEND_BUDGET_USD=${DAILY_SPEND_BUDGET_USD}
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
      - AUTH_SIGNUP_ENABLED=${AUTH_SIGNUP_ENABLED:-true}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - chat-network-staging

  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    container_name: chat_supertokens_staging
    depends_on:
      - db
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-devpassword}@db:5432/${DB_NAME:-chatbot_dev}"
      POSTGRESQL_TABLE_SCHEMA: auth
      # API_KEYS: ${SUPERTOKENS_API_KEY}
    networks:
      - chat-network-staging
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_frontend_staging
    # The tab reads "Staging Ari", like dev's "Dev Ari"
    environment:
      - TITLE_PREFIX=Staging
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network-staging

volumes:
  pgdata_staging:

networks:
  chat-network-staging:
    driver: bridge
