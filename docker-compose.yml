services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-chatbot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat_backend
    environment:
      - PORT=${PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@db:5432/${DB_NAME:-chatbot}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Qwen/Qwen3.5-9B}
      - MOCK_AI_BASE_URL=${MOCK_AI_BASE_URL:-}
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS:-5000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - chat-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network

volumes:
  pgdata:

networks:
  chat-network:
    driver: bridge
