# Development infrastructure — PostgreSQL + SuperTokens only.
# Backend and frontend run on the host via `npm run dev` (reads .env
# directly); this stack provides only the shared services. Dev and
# staging share `.env`, so their published ports collide: only run one
# local stack at a time.
#
# Usage:
#   docker compose -f compose.staging.yml --env-file .env down  # if up
#   docker compose -f compose.dev.yml --env-file .env up -d
#   npm run migrate
#   npm run dev

# Own project name: dev, staging and prod share this directory, and a shared
# project would let one tier's `up` replace another tier's containers.
name: alex-chat-bot-dev

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db_dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Exposed on all interfaces — accessible from host and agent container
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat-network-dev

  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    container_name: chat_supertokens_dev
    depends_on:
      - db
    # Expose to host for local backend
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      POSTGRESQL_TABLE_SCHEMA: auth
    networks:
      - chat-network-dev
    restart: unless-stopped

volumes:
  pgdata_dev:
    # Pinned to the name it had before dev got its own project name, so the
    # working set stays where it is.
    name: alex-chat-bot_pgdata_dev

networks:
  chat-network-dev:
    driver: bridge
