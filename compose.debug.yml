services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db_debug
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata_debug:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chat-network-debug

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat_backend_debug
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - DEBUG=${DEBUG}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - TITLING_MODEL=${TITLING_MODEL}
      - MOCK_AI_BASE_URL=${MOCK_AI_BASE_URL}
      - AI_STREAM_IDLE_TIMEOUT_MS=${AI_STREAM_IDLE_TIMEOUT_MS}
      - EXCHANGE_STALENESS_MS=${EXCHANGE_STALENESS_MS}
      - AI_TITLING_TIMEOUT_MS=${AI_TITLING_TIMEOUT_MS}
      - ENABLE_REASONING=${ENABLE_REASONING}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - THREAD_ANALYSIS_MODE=${THREAD_ANALYSIS_MODE}
      - JUDGE_MODEL=${JUDGE_MODEL}
      - REWRITE_MODEL=${REWRITE_MODEL}
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - chat-network-debug

  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    container_name: chat_supertokens_debug
    depends_on:
      - db
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      # API_KEYS: ${SUPERTOKENS_API_KEY}
    networks:
      - chat-network-debug
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat_frontend_debug
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network-debug

volumes:
  pgdata_debug:

networks:
  chat-network-debug:
    driver: bridge
