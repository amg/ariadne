# Pre-commit gate: runs the full validation suite on every commit.
# Installed by `npm run prepare` (lefthook install).
# The gate lives in package.json scripts so there is one source of truth.
pre-commit:
  commands:
    gate:
      # The commit stays here; offload runs the gate on the PC when it's
      # switched on, and here otherwise.
      run: if command -v offload >/dev/null 2>&1; then offload npm run gate; else npm run gate; fi
